; Un bloque por broker. El nombre entre corchetes es el id que usa el panel.
; Un broker sin todos los campos aparece desactivado en el panel.
;   company   companyCode  (Avis Canarias = 200037)
;   customer  customerCode del canal del broker
;   user / password
;   rate      tarifa opcional; admite {station}, p. ej. AG1{station} → AG1LPA
;   entorno   produccion (Rentway real) o prueba (servidor de pruebas de Jimpisoft)

